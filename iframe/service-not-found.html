<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KiRouting Bridge Server</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "Microsoft Sans Serif", Tahoma, sans-serif;
  font-size: 12px; color: #000; background: #f0f0f0;
}
.dialog {
  display: flex; flex-direction: column;
  height: 100vh; padding: 24px;
  align-items: center; justify-content: center;
}
.icon {
  font-size: 48px; margin-bottom: 16px;
  color: #d4760a;
}
h2 {
  font-size: 14px; font-weight: 700;
  margin-bottom: 8px; text-align: center;
}
.desc {
  font-size: 12px; color: #444;
  margin-bottom: 20px; text-align: center;
  line-height: 1.6;
}
.steps {
  width: 100%; max-width: 380px;
  background: #fff; border: 1px solid #ccc;
  border-radius: 4px; padding: 16px;
  margin-bottom: 20px;
}
.step {
  display: flex; align-items: flex-start;
  margin-bottom: 12px;
}
.step:last-child { margin-bottom: 0; }
.step-num {
  width: 22px; height: 22px;
  background: #0078d4; color: #fff;
  border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0; margin-right: 10px; margin-top: 1px;
}
.step-text {
  font-size: 12px; line-height: 1.5;
  color: #222;
}
.step-text a {
  color: #0078d4; text-decoration: none;
}
.step-text a:hover { text-decoration: underline; }
.buttons {
  display: flex; gap: 10px;
  justify-content: center; flex-wrap: wrap;
}
button {
  padding: 6px 16px; font-size: 12px;
  border: 1px solid #ababab; border-radius: 3px;
  background: #e1e1e1; color: #000;
  cursor: pointer; min-width: 100px;
}
button:hover { background: #d0d0d0; }
button.primary {
  background: #0078d4; color: #fff;
  border-color: #0078d4;
}
button.primary:hover { background: #006cbd; }
.status {
  margin-top: 12px; font-size: 11px;
  color: #666; text-align: center;
  min-height: 16px;
}
.status.error { color: #c42b1c; }
.status.success { color: #0f7b0f; }
</style>
</head>
<body>
<div class="dialog">
  <div class="icon">&#9888;</div>
  <h2 id="title"></h2>
  <p class="desc" id="desc"></p>
  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <span class="step-text" id="step1"></span>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <span class="step-text" id="step2"></span>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <span class="step-text" id="step3"></span>
    </div>
  </div>
  <div class="buttons">
    <button id="btn-download" class="primary" onclick="openDownload()"></button>
    <button id="btn-retry" onclick="retry()"></button>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
var MSG_PREFIX = 'kirouting-integration.';
var REPO_BASE = 'https://raw.githubusercontent.com/easyeda/eext-kirouting-integration/main/bridge_server';
var BAT_CONTENT = [
'@echo off',
'chcp 65001 >nul 2>&1',
'setlocal enabledelayedexpansion',
'',
'echo ============================================',
'echo   KiRouting Bridge Server - One-Click Start',
'echo ============================================',
'echo.',
'',
'cd /d "%~dp0"',
'',
'REM --- Configuration ---',
'set "REPO_BASE=' + REPO_BASE + '"',
'set "SERVER_DIR=%~dp0bridge_server"',
'',
'REM --- Step 1: Check Python ---',
'echo [1/5] Checking Python...',
'python --version >nul 2>&1',
'if errorlevel 1 (',
'    echo Python not found. Attempting to install via winget...',
'    winget install Python.Python.3.12 --accept-package-agreements --accept-source-agreements',
'    if errorlevel 1 (',
'        echo.',
'        echo ERROR: Failed to install Python automatically.',
'        echo Please install Python 3.8+ manually from https://www.python.org/downloads/',
'        echo Make sure to check "Add Python to PATH" during installation.',
'        echo.',
'        pause',
'        exit /b 1',
'    )',
'    echo Python installed. You may need to restart this script for PATH to take effect.',
'    echo.',
'    pause',
'    exit /b 0',
')',
'for /f "tokens=2" %%v in (\'python --version 2^>^&1\') do echo   Found Python %%v',
'',
'REM --- Step 2: Download bridge_server files ---',
'echo.',
'echo [2/5] Downloading bridge server files...',
'',
'if not exist "!SERVER_DIR!" mkdir "!SERVER_DIR!"',
'',
'set "FILES=server.py routing_runner.py easyeda_to_kicad.py kicad_diff.py layer_mapping.py models.py coord_transform.py analysis.py verify_precision.py requirements.txt"',
'',
'set "DOWNLOAD_OK=1"',
'for %%f in (%FILES%) do (',
'    if not exist "!SERVER_DIR!\\%%f" (',
'        echo   Downloading %%f...',
'        curl -sL "%REPO_BASE%/%%f" -o "!SERVER_DIR!\\%%f"',
'        if errorlevel 1 (',
'            set "DOWNLOAD_OK=0"',
'            echo   ERROR: Failed to download %%f',
'        )',
'    ) else (',
'        echo   %%f already exists, skipping',
'    )',
')',
'',
'if "!DOWNLOAD_OK!"=="0" (',
'    echo.',
'    echo ERROR: Some files failed to download. Please check your network connection.',
'    echo.',
'    pause',
'    exit /b 1',
')',
'echo   All files OK',
'',
'REM --- Step 3: Check pip dependencies ---',
'echo.',
'echo [3/5] Checking Python dependencies...',
'',
'python -c "import fastapi; import uvicorn; import numpy" 2>nul',
'if errorlevel 1 (',
'    echo   Installing dependencies...',
'    pip install -r "!SERVER_DIR!\\requirements.txt"',
'    if errorlevel 1 (',
'        echo.',
'        echo ERROR: Failed to install Python dependencies.',
'        echo Try running manually: pip install -r requirements.txt',
'        echo.',
'        pause',
'        exit /b 1',
'    )',
')',
'echo   Dependencies OK',
'',
'REM --- Step 4: Check KiCadRoutingTools ---',
'echo.',
'echo [4/5] Checking KiCadRoutingTools...',
'',
'set "TOOLS_DIR=%~dp0KiCadRoutingTools"',
'if not exist "!TOOLS_DIR!\\route.py" (',
'    echo   KiCadRoutingTools not found, downloading...',
'    set "ZIP_FILE=%~dp0KiCadRoutingTools.zip"',
'    curl -sL "https://github.com/drandyhaas/KiCadRoutingTools/archive/refs/heads/main.zip" -o "!ZIP_FILE!"',
'    if errorlevel 1 (',
'        echo.',
'        echo ERROR: Failed to download KiCadRoutingTools.',
'        echo Please check your network connection.',
'        echo.',
'        pause',
'        exit /b 1',
'    )',
'    echo   Extracting...',
'    %SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -Command "Expand-Archive -Path \'!ZIP_FILE!\' -DestinationPath \'%~dp0\' -Force"',
'    if errorlevel 1 (',
'        echo.',
'        echo ERROR: Failed to extract KiCadRoutingTools.',
'        echo.',
'        pause',
'        exit /b 1',
'    )',
'    ren "%~dp0KiCadRoutingTools-main" KiCadRoutingTools',
'    del "!ZIP_FILE!"',
')',
'echo   KiCadRoutingTools OK',
'',
'REM --- Step 5: Start server ---',
'echo.',
'echo [5/5] Starting bridge server...',
'echo.',
'echo ============================================',
'echo   Server running at http://localhost:8765',
'echo   Press Ctrl+C to stop',
'echo ============================================',
'echo.',
'',
'cd /d "!SERVER_DIR!"',
'python server.py',
'pause'
].join('\r\n');

var isCN = /^zh/i.test(navigator.language || '');

var i18n = {
  title:    isCN ? '桥接服务器未运行' : 'Bridge Server Not Running',
  desc:     isCN ? 'KiRouting 桥接服务器未在 localhost:8765 上运行。\n请按以下步骤启动：'
                 : 'The KiRouting bridge server is not running on localhost:8765.\nPlease follow these steps:',
  step1:    isCN ? '点击下方按钮 <a href="#" onclick="openDownload();return false">下载启动脚本</a>（start_server.bat）'
                 : '<a href="#" onclick="openDownload();return false">Download the startup script</a> (start_server.bat)',
  step2:    isCN ? '双击运行 <b>start_server.bat</b>（自动下载全部文件并安装依赖）'
                 : 'Double-click <b>start_server.bat</b> (auto-downloads all files and installs dependencies)',
  step3:    isCN ? '点击下方"重试"按钮重新连接'
                 : 'Click "Retry" below to reconnect',
  download: isCN ? '下载启动脚本' : 'Download Script',
  retry:    isCN ? '重试' : 'Retry',
  checking: isCN ? '正在检测连接...' : 'Checking connection...',
  failed:   isCN ? '仍无法连接，请确认服务器已启动' : 'Still cannot connect. Please ensure the server is running.',
  success:  isCN ? '连接成功！正在打开布线工具...' : 'Connected! Opening routing tool...',
};

document.getElementById('title').textContent = i18n.title;
document.getElementById('desc').textContent = i18n.desc;
document.getElementById('step1').innerHTML = i18n.step1;
document.getElementById('step2').innerHTML = i18n.step2;
document.getElementById('step3').innerHTML = i18n.step3;
document.getElementById('btn-download').textContent = i18n.download;
document.getElementById('btn-retry').textContent = i18n.retry;

function publish(topic, data) {
  var fullTopic = MSG_PREFIX + topic;
  var payload = JSON.stringify(data || {});
  if (window.eda && eda.sys_MessageBus) {
    if (typeof eda.sys_MessageBus.publish === 'function') {
      eda.sys_MessageBus.publish(fullTopic, payload);
    } else if (typeof eda.sys_MessageBus.push === 'function') {
      eda.sys_MessageBus.push(fullTopic, payload);
    }
  }
}

function openDownload() {
  var blob = new Blob([BAT_CONTENT], { type: 'application/x-bat' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'start_server.bat';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  var statusEl = document.getElementById('status');
  statusEl.className = 'status success';
  statusEl.textContent = isCN ? '下载完成，请双击运行' : 'Downloaded. Double-click to run.';
}

function retry() {
  var statusEl = document.getElementById('status');
  statusEl.className = 'status';
  statusEl.textContent = i18n.checking;
  publish('retry-connection', {});
}

function subscribe(topic, handler) {
  var fullTopic = MSG_PREFIX + topic;
  if (window.eda && eda.sys_MessageBus && eda.sys_MessageBus.subscribe) {
    eda.sys_MessageBus.subscribe(fullTopic, function(msg) {
      try {
        handler(typeof msg === 'string' ? JSON.parse(msg) : msg);
      } catch(e) {}
    });
  }
}

subscribe('retry-result', function(data) {
  var statusEl = document.getElementById('status');
  if (data && data.success) {
    statusEl.className = 'status success';
    statusEl.textContent = i18n.success;
  } else {
    statusEl.className = 'status error';
    statusEl.textContent = i18n.failed;
  }
});
</script>
</body>
</html>
